services:
  - type: web
    name: aether-eye-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c "python -m alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: ENABLE_STAC_WATCHER
        value: "false"
      - key: ENABLE_ACTIVITY_AGGREGATOR
        value: "false"
      - key: LOG_LEVEL
        value: "info"
      - key: AIRCRAFT_CLASSIFIER_CONFIG_PATH
        value: configs/inference/aircraft_classifier.yaml
      - key: CHANGE_DETECTOR_CONFIG_PATH
        value: configs/inference/change_detector.yaml
      - key: DB_SSL
        value: "require"
    healthCheckPath: /health
    autoDeploy: true
