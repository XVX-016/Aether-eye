services:
  - type: web
    name: aether-eye-backend
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      - key: ENABLE_STAC_WATCHER
        value: "false"
      - key: ENABLE_ACTIVITY_AGGREGATOR
        value: "true"
      - key: LOG_LEVEL
        value: "info"
      - key: AIRCRAFT_CLASSIFIER_CONFIG_PATH
        value: configs/inference/aircraft_classifier.yaml
      - key: CHANGE_DETECTOR_CONFIG_PATH
        value: configs/inference/change_detector.yaml
      - key: DB_SSL
        value: "require"
    healthCheckPath: /health
    autoDeploy: true
