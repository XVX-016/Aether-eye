<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <style>
    .title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .subtitle { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-style: italic; fill: #64748b; text-anchor: middle; }
    .axis-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #334155; text-anchor: middle; }
    .label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #475569; }
    .cell-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .legend-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
    .note { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; font-style: italic; }
    .annotation { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1e3a8a; }
  </style>

  <!-- Background -->
  <rect width="800" height="700" fill="#ffffff"/>

  <!-- Title Section -->
  <text x="400" y="30" class="title">Fig. 5 — Aircraft Classification Confusion Matrix and Per-Category Metrics</text>
  <text x="400" y="48" class="subtitle">Grouped 6×6 Super-Category Evaluation (98 Classes Total)</text>

  <!-- ==================== PART 1: CONFUSION MATRIX (Top 400px) ==================== -->
  <g transform="translate(140, 70)">
    <!-- Y-axis Label -->
    <text x="-65" y="150" class="axis-title" transform="rotate(-90, -65, 150)">True Category</text>
    
    <!-- X-axis Label -->
    <text x="150" y="-35" class="axis-title">Predicted Category</text>

    <!-- Column Headers (Top) -->
    <g transform="translate(0, -10)">
      <text x="25" y="0" class="label" text-anchor="middle">Fighters</text>
      <text x="75" y="0" class="label" text-anchor="middle">Bombers</text>
      <text x="125" y="0" class="label" text-anchor="middle">Transport</text>
      <text x="175" y="0" class="label" text-anchor="middle">Rotary</text>
      <text x="225" y="0" class="label" text-anchor="middle">UAVs</text>
      <text x="275" y="0" class="label" text-anchor="middle">Maritime</text>
    </g>

    <!-- Row Headers (Left) -->
    <g transform="translate(-10, 0)">
      <text x="0" y="25" class="label" text-anchor="end" dominant-baseline="central">Fighters (F)</text>
      <text x="0" y="75" class="label" text-anchor="end" dominant-baseline="central">Bombers (B)</text>
      <text x="0" y="125" class="label" text-anchor="end" dominant-baseline="central">Transport (T)</text>
      <text x="0" y="175" class="label" text-anchor="end" dominant-baseline="central">Rotary (R)</text>
      <text x="0" y="225" class="label" text-anchor="end" dominant-baseline="central">UAVs (U)</text>
      <text x="0" y="275" class="label" text-anchor="end" dominant-baseline="central">Maritime (M)</text>
    </g>

    <!-- Matrix Cells (50x50 each) -->
    <!-- Row 1: Fighters [82, 3, 2, 1, 8, 4] -->
    <rect x="0" y="0" width="50" height="50" fill="#15803d" stroke="#ffffff" stroke-width="1.5"/>
    <text x="25" y="25" class="cell-text" fill="#ffffff">82%</text>

    <rect x="50" y="0" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="75" y="25" class="cell-text" fill="#1e293b">3%</text>

    <rect x="100" y="0" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="125" y="25" class="cell-text" fill="#1e293b">2%</text>

    <rect x="150" y="0" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="175" y="25" class="cell-text" fill="#1e293b">1%</text>

    <rect x="200" y="0" width="50" height="50" fill="#fca5a5" stroke="#ffffff" stroke-width="1.5"/>
    <text x="225" y="25" class="cell-text" fill="#991b1b">8%</text>

    <rect x="250" y="0" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="275" y="25" class="cell-text" fill="#1e293b">4%</text>

    <!-- Row 2: Bombers [2, 88, 4, 0, 4, 2] -->
    <rect x="0" y="50" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="25" y="75" class="cell-text" fill="#1e293b">2%</text>

    <rect x="50" y="50" width="50" height="50" fill="#15803d" stroke="#ffffff" stroke-width="1.5"/>
    <text x="75" y="75" class="cell-text" fill="#ffffff">88%</text>

    <rect x="100" y="50" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="125" y="75" class="cell-text" fill="#1e293b">4%</text>

    <rect x="150" y="50" width="50" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="175" y="75" class="cell-text" fill="#1e293b">0%</text>

    <rect x="200" y="50" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="225" y="75" class="cell-text" fill="#1e293b">4%</text>

    <rect x="250" y="50" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="275" y="75" class="cell-text" fill="#1e293b">2%</text>

    <!-- Row 3: Transport [1, 3, 85, 2, 6, 3] -->
    <rect x="0" y="100" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="25" y="125" class="cell-text" fill="#1e293b">1%</text>

    <rect x="50" y="100" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="75" y="125" class="cell-text" fill="#1e293b">3%</text>

    <rect x="100" y="100" width="50" height="50" fill="#15803d" stroke="#ffffff" stroke-width="1.5"/>
    <text x="125" y="125" class="cell-text" fill="#ffffff">85%</text>

    <rect x="150" y="100" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="175" y="125" class="cell-text" fill="#1e293b">2%</text>

    <rect x="200" y="100" width="50" height="50" fill="#fca5a5" stroke="#ffffff" stroke-width="1.5"/>
    <text x="225" y="125" class="cell-text" fill="#991b1b">6%</text>

    <rect x="250" y="100" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="275" y="125" class="cell-text" fill="#1e293b">3%</text>

    <!-- Row 4: Rotary [1, 0, 2, 89, 5, 3] -->
    <rect x="0" y="150" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="25" y="175" class="cell-text" fill="#1e293b">1%</text>

    <rect x="50" y="150" width="50" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="75" y="175" class="cell-text" fill="#1e293b">0%</text>

    <rect x="100" y="150" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="125" y="175" class="cell-text" fill="#1e293b">2%</text>

    <rect x="150" y="150" width="50" height="50" fill="#15803d" stroke="#ffffff" stroke-width="1.5"/>
    <text x="175" y="175" class="cell-text" fill="#ffffff">89%</text>

    <rect x="200" y="150" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="225" y="175" class="cell-text" fill="#1e293b">5%</text>

    <rect x="250" y="150" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="275" y="175" class="cell-text" fill="#1e293b">3%</text>

    <!-- Row 5: UAVs [10, 2, 3, 4, 75, 6] -->
    <rect x="0" y="200" width="50" height="50" fill="#fca5a5" stroke="#ffffff" stroke-width="1.5"/>
    <text x="25" y="225" class="cell-text" fill="#991b1b">10%</text>

    <rect x="50" y="200" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="75" y="225" class="cell-text" fill="#1e293b">2%</text>

    <rect x="100" y="200" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="125" y="225" class="cell-text" fill="#1e293b">3%</text>

    <rect x="150" y="200" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="175" y="225" class="cell-text" fill="#1e293b">4%</text>

    <rect x="200" y="200" width="50" height="50" fill="#15803d" stroke="#ffffff" stroke-width="1.5"/>
    <text x="225" y="225" class="cell-text" fill="#ffffff">75%</text>

    <rect x="250" y="200" width="50" height="50" fill="#fca5a5" stroke="#ffffff" stroke-width="1.5"/>
    <text x="275" y="225" class="cell-text" fill="#991b1b">6%</text>

    <!-- Row 6: Maritime [3, 2, 4, 3, 5, 83] -->
    <rect x="0" y="250" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="25" y="275" class="cell-text" fill="#1e293b">3%</text>

    <rect x="50" y="250" width="50" height="50" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="75" y="275" class="cell-text" fill="#1e293b">2%</text>

    <rect x="100" y="250" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="125" y="275" class="cell-text" fill="#1e293b">4%</text>

    <rect x="150" y="250" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="175" y="275" class="cell-text" fill="#1e293b">3%</text>

    <rect x="200" y="250" width="50" height="50" fill="#eff6ff" stroke="#ffffff" stroke-width="1.5"/>
    <text x="225" y="275" class="cell-text" fill="#1e293b">5%</text>

    <rect x="250" y="250" width="50" height="50" fill="#15803d" stroke="#ffffff" stroke-width="1.5"/>
    <text x="275" y="275" class="cell-text" fill="#ffffff">83%</text>

    <!-- Matrix Legend (Right side) -->
    <g transform="translate(330, 40)">
      <text x="0" y="0" class="label" style="font-size: 11px;">Legend:</text>
      
      <rect x="0" y="15" width="16" height="16" fill="#15803d" rx="2"/>
      <text x="24" y="27" class="legend-text">Correct Prediction (Diagonal)</text>

      <rect x="0" y="40" width="16" height="16" fill="#fca5a5" rx="2"/>
      <text x="24" y="52" class="legend-text">High Confusion (&gt; 5%)</text>

      <rect x="0" y="65" width="16" height="16" fill="#eff6ff" rx="2"/>
      <text x="24" y="77" class="legend-text">Low Confusion (1% - 5%)</text>

      <rect x="0" y="90" width="16" height="16" fill="#ffffff" stroke="#cbd5e1" rx="2"/>
      <text x="24" y="102" class="legend-text">Zero Confusion (0%)</text>
    </g>
  </g>

  <!-- ==================== PART 2: BAR CHART (Bottom 300px) ==================== -->
  <g transform="translate(100, 430)">
    <!-- Chart Title / Annotation -->
    <text x="0" y="15" class="axis-title" text-anchor="start">Per-Category Precision and Recall</text>
    
    <!-- Macro F1 Badge -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="160" height="26" fill="#dbeafe" rx="4" stroke="#bfdbfe"/>
      <text x="80" y="17" class="annotation" text-anchor="middle">Macro F1 = 0.7199</text>
    </g>

    <!-- Grid lines & Y-axis Scale (0.0 to 1.0) -->
    <g transform="translate(80, 40)">
      <!-- Lines -->
      <line x1="0" y1="160" x2="560" y2="160" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="0" y1="120" x2="560" y2="120" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="0" y1="80" x2="560" y2="80" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="0" y1="40" x2="560" y2="40" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="0" y1="0" x2="560" y2="0" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Y Axis Labels -->
      <text x="-10" y="164" class="legend-text" text-anchor="end">0.0</text>
      <text x="-10" y="124" class="legend-text" text-anchor="end">0.25</text>
      <text x="-10" y="84" class="legend-text" text-anchor="end">0.50</text>
      <text x="-10" y="44" class="legend-text" text-anchor="end">0.75</text>
      <text x="-10" y="4" class="legend-text" text-anchor="end">1.00</text>

      <!-- BARS GROUP (Height scale: 1.0 = 160px) -->

      <!-- Group 1: Fighters (P=0.81 -> 129.6px, R=0.82 -> 131.2px) -->
      <g transform="translate(20, 0)">
        <rect x="0" y="30.4" width="22" height="129.6" fill="#1d4ed8" rx="2"/>
        <text x="11" y="24" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.81</text>
        
        <rect x="25" y="28.8" width="22" height="131.2" fill="#60a5fa" rx="2"/>
        <text x="36" y="22" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.82</text>

        <text x="23" y="180" class="label" text-anchor="middle">Fighters</text>
      </g>

      <!-- Group 2: Bombers (P=0.89 -> 142.4px, R=0.88 -> 140.8px) -->
      <g transform="translate(110, 0)">
        <rect x="0" y="17.6" width="22" height="142.4" fill="#1d4ed8" rx="2"/>
        <text x="11" y="11" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.89</text>

        <rect x="25" y="19.2" width="22" height="140.8" fill="#60a5fa" rx="2"/>
        <text x="36" y="13" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.88</text>

        <text x="23" y="180" class="label" text-anchor="middle">Bombers</text>
      </g>

      <!-- Group 3: Transport (P=0.84 -> 134.4px, R=0.85 -> 136px) -->
      <g transform="translate(200, 0)">
        <rect x="0" y="25.6" width="22" height="134.4" fill="#1d4ed8" rx="2"/>
        <text x="11" y="19" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.84</text>

        <rect x="25" y="24.0" width="22" height="136.0" fill="#60a5fa" rx="2"/>
        <text x="36" y="18" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.85</text>

        <text x="23" y="180" class="label" text-anchor="middle">Transport</text>
      </g>

      <!-- Group 4: Rotary (P=0.87 -> 139.2px, R=0.89 -> 142.4px) -->
      <g transform="translate(290, 0)">
        <rect x="0" y="20.8" width="22" height="139.2" fill="#1d4ed8" rx="2"/>
        <text x="11" y="14" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.87</text>

        <rect x="25" y="17.6" width="22" height="142.4" fill="#60a5fa" rx="2"/>
        <text x="36" y="11" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.89</text>

        <text x="23" y="180" class="label" text-anchor="middle">Rotary</text>
      </g>

      <!-- Group 5: UAVs (P=0.74 -> 118.4px, R=0.75 -> 120px) -->
      <g transform="translate(380, 0)">
        <rect x="0" y="41.6" width="22" height="118.4" fill="#1d4ed8" rx="2"/>
        <text x="11" y="35" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.74</text>

        <rect x="25" y="40.0" width="22" height="120.0" fill="#60a5fa" rx="2"/>
        <text x="36" y="34" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.75</text>

        <text x="23" y="180" class="label" text-anchor="middle">UAVs</text>
      </g>

      <!-- Group 6: Maritime (P=0.82 -> 131.2px, R=0.83 -> 132.8px) -->
      <g transform="translate(470, 0)">
        <rect x="0" y="28.8" width="22" height="131.2" fill="#1d4ed8" rx="2"/>
        <text x="11" y="22" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.82</text>

        <rect x="25" y="27.2" width="22" height="132.8" fill="#60a5fa" rx="2"/>
        <text x="36" y="21" class="legend-text" text-anchor="middle" style="font-size: 10px; font-weight: bold;">.83</text>

        <text x="23" y="180" class="label" text-anchor="middle">Maritime</text>
      </g>

      <!-- Bar Chart Legend -->
      <g transform="translate(380, -25)">
        <rect x="0" y="0" width="14" height="14" fill="#1d4ed8" rx="2"/>
        <text x="20" y="11" class="legend-text">Precision</text>

        <rect x="80" y="0" width="14" height="14" fill="#60a5fa" rx="2"/>
        <text x="100" y="11" class="legend-text">Recall</text>
      </g>
    </g>
  </g>

  <!-- Footnote -->
  <text x="400" y="685" class="note">† Grouped super-category analysis. Full 98-class confusion matrix available at github.com/XVX-016/Aether-eye</text>
</svg>
